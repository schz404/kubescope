name: Build and Publish Kubescope

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Generate Software Bill of Materials (SBOM) using Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
          output-file: 'sbom.json'

      - name: Scan SBOM for Vulnerabilities using Grype
        uses: anchore/scan-action@v7
        with:
          sbom: 'sbom.json'
          fail-build: true
          severity-cutoff: 'high'
          output-format: 'table'
        env:
          GRYPE_DB_AUTO_UPDATE: "true"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: sbom.json

      - name: Install Cosign for Image Signing
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image with Cosign (Keyless)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
